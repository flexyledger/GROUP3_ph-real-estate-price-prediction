services:
  - type: web
    name: group3-ph-real-estate-api
    runtime: python
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt uvicorn fastapi
    startCommand: uvicorn app.api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.14
